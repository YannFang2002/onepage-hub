[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.4.1

[onepage]
version = 0.2.4

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_pngdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-onepage-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-onepage-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-onepage-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-onepage-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

; OnePage ESP32-C61 port. Inherits base's pioarduino platform (crosspoint's
; blessed build) and uses the custom onepage-c61 board (16MB flash, 8MB PSRAM).
[env:onepage]
extends = base
board = onepage-c61
; The C61HR2 module on this board carries an 8MB quad PSRAM die, and 80MHz is
; what arduino-esp32 ships by default. Verified on hardware: the boot log prints
; "PSRAM size=8388608 free=8379832", and the 52272-byte frame buffer lives there
; (EInkDisplay allocates PSRAM-first) with thousands of clean refreshes since.
; An earlier note here claimed the die only inits reliably at <=40MHz; that was
; wrong for this module, so the speed is left at the 80MHz default.
; Keep PSRAM on: the C61 has only 320KB SRAM, and crosspoint needs both the frame
; buffer and the CJK glyph cache out of internal RAM.
; CONFIG_SPIRAM is the master switch — without it the SPEED/MALLOC keys are dead
; and PSRAM stays OFF (heap is then only ~126KB, large EPUB chapters OOM -> abort).
; Triggers a full arduino rebuild (pioarduino custom_sdkconfig).
custom_sdkconfig =
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_QUAD=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_SPIRAM_USE_MALLOC=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=65536
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
; Prefer PSRAM for the WiFi driver's dynamic RX/TX buffers and LWIP pools.
; Those are the single largest runtime consumer of internal SRAM (up to ~100 KB
; with the 32-deep buffer pools); at 80 MHz PSRAM they cost some bandwidth but
; e-ink workloads don't care, and TLS sessions for OTA/OPDS need the freed
; internal headroom.
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
; Bluetooth fully disabled: the BLE page-turner feature was removed. This frees
; the NimBLE host + controller's internal-SRAM buffers, task stacks and mbuf
; pools permanently. Internal SRAM is the C61's scarcest resource (~320 KB shared
; with WiFi/LWIP/runtime heap); the TLS sessions behind OTA update checks and
; OPDS need that headroom — an update check with BLE up ran at ~29 KB free and
; intermittently failed. Also drops the BT libs from the image (~200 KB flash).
  CONFIG_BT_ENABLED=n
; System RTC slow clock -> external 32.768 kHz crystal (board has one on the
; dedicated XTAL_32K pins), for accurate RTC timekeeping now that BLE is gone.
  CONFIG_RTC_CLK_SRC_INT_RC=n
  CONFIG_RTC_CLK_SRC_EXT_CRYS=y
; NOTE: B2 (system auto light-sleep: CONFIG_PM_ENABLE + FREERTOS_USE_TICKLESS_IDLE
; + ESP_PHY_MAC_BB_PD) is currently UNBUILDABLE on this C61 arduino-libs build.
; Enabling it links in the PM/tickless/MAC-BB-PD code path (sleep_modem, pm_impl,
; freertos tickless, phy MAC_BB_PD) whose .text.* sections have NO placement rule
; in ld/sections.ld (arduino-esp32 ships PM off, so this path was never validated).
; Result: 13 orphan sections across 4 libs -> esptool fatal "Segment ... lands in
; same 64 KB flash mapping ... Can't generate binary". Unlike the single
; sleep_clock section (patch_ld_sleep_clock.py), this is a divergent multi-lib
; orphan/layout failure, not a one-line LD patch. Revisit when arduino-esp32 for
; C61 ships validated PM/light-sleep linker placement.
; SPI flash read clock 40->80MHz: faster boot + code-from-flash execution at
; runtime (does NOT speed up flashing). W25Q128JW / PY25Q128HA both rate >=104MHz
; so 80MHz DIO is well within spec. Revert to 40M if the board shows instability.
  CONFIG_ESPTOOLPY_FLASHFREQ_40M=n
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
; Strip arduino-esp32's default heavy managed components (not needed for a reader).
; This also removes the esp_https_server cert-embed step that trips PlatformIO's
; ".pio/build/.../https_server.crt.S not found" path-doubling bug.
custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp-modbus
  espressif/esp-serial-flasher
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/cbor
build_flags =
  ${base.build_flags}
  -DONEPAGE_C61=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"onepage-hub-${onepage.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2



[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG
